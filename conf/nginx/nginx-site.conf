# Replaces the image's default site config: start.sh copies
# /var/www/html/conf/nginx/nginx-site.conf -> /etc/nginx/sites-available/default.conf
#
# The stock config ends its location / with "try_files $uri $uri/ =404", so nginx answered
# every URL except / with its own 404 page and Laravel's router never ran — /screener/analyze,
# /api/screener/live and even Laravel's /up health route all 404'd without reaching PHP.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Keep this line exactly as written. start.sh rewrites it with
    #   sed -i "s#root /var/www/html;#root ${WEBROOT};#g"
    # and the Dockerfile sets WEBROOT=/var/www/html/public, so any edit to the text
    # silently leaves the document root pointing at the project root instead of public/.
    root /var/www/html;

    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;

        # /screener/analyze fetches daily + intraday candles and news from Yahoo, which can
        # take well over the default 60s on a cold cache.
        fastcgi_read_timeout 300;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg)$ {
        expires 5d;
    }

    # Deny dot-files, but keep /.well-known reachable for certificate challenges
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /.well-known {
        allow all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;

    sendfile off;
}
